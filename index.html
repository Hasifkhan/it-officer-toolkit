<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT Officer Toolkit — Practical Tools for Everyday IT Support</title>
  <meta name="description" content="Free, login-free browser tools for IT Officers: subnet calculator, IP tracker, troubleshooting guides, Windows command library, daily report generator, inventory and more. Everything runs locally in your browser.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <script>
    /* Apply saved theme before first paint (default: light). */
    try { var t = JSON.parse(localStorage.getItem('itk.theme')); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="app-header no-print">
    <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="sidebar">
      <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <a class="brand" href="#/" aria-label="IT Officer Toolkit — home">
      <img src="assets/icons/favicon.svg" width="32" height="32" alt="" class="brand-logo">
      <span class="brand-text"><strong>IT Officer Toolkit</strong><small>Practical Tools for Everyday IT Support</small></span>
    </a>
    <div class="search" role="search">
      <label for="global-search" class="sr-only">Search tools, commands, ports and guides</label>
      <input id="global-search" type="search" placeholder="Search tools, commands, ports, guides…  ( / )" autocomplete="off" spellcheck="false"
             role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list">
      <div id="search-results" class="search-results" role="listbox" aria-label="Search results" hidden></div>
    </div>
    <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch to dark theme" aria-pressed="false" title="Toggle light / dark theme"></button>
  </header>

  <div class="layout">
    <div class="scrim" id="scrim" hidden></div>
    <nav class="sidebar no-print" id="sidebar" aria-label="Tool categories"></nav>
    <main id="main" class="main" tabindex="-1">
      <noscript><div class="alert alert-warn">IT Officer Toolkit needs JavaScript enabled. All tools run locally in your browser; nothing is sent to a server.</div></noscript>
    </main>
  </div>

  <footer class="app-footer no-print">
    <div>
      <strong>IT Officer Toolkit</strong> v<span id="app-version">1.0.0</span> — free, login-free, runs entirely in your browser. <span id="footer-priv">No data is sent to any server.</span>
    </div>
    <div class="footer-links">
      <a href="#/privacy">Data &amp; privacy</a>
      <a href="#/admin">Admin</a>
      <a href="https://github.com/YOUR-USERNAME/it-officer-toolkit" target="_blank" rel="noopener noreferrer" title="Placeholder — replace YOUR-USERNAME with your GitHub account after publishing">GitHub repository (placeholder link)</a>
    </div>
  </footer>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- Plain scripts (not ES modules) so the site also works when index.html is opened directly from disk. Order matters. -->
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/datatable.js"></script>
  <script src="assets/js/ip-tools.js"></script>
  <script src="assets/js/troubleshooting.js"></script>
  <script src="assets/js/command-library.js"></script>
  <script src="assets/js/report-generator.js"></script>
  <script src="assets/js/inventory.js"></script>
  <script src="assets/js/calculators.js"></script>
  <script src="assets/js/password.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/analytics.js"></script>
  <script src="assets/js/admin.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
